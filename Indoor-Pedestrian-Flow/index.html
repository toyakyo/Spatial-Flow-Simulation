<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>室內人流模擬器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>室內人流模擬器</h1>
  <span>選工具後在場地上拖曳放置 · 「選取」可拖動物件、點選後在右欄調參數 · Delete 刪除 · 空白鍵開始／暫停</span>
</header>

<main>
  <div class="panel left">
    <h2>放置</h2>
    <div class="tools" id="tools"></div>
    <div class="row"><label for="snap">對齊 0.5 m 格線</label><input id="snap" type="checkbox" checked></div>
    <div class="row"><label>場地 寬×深 (m)</label>
      <span><input id="worldW" type="number" min="10" max="100" step="1">
      × <input id="worldH" type="number" min="8" max="80" step="1"></span></div>

    <h2 class="gap">人流</h2>
    <div class="row"><label>總人數</label>
      <select id="totalSel">
        <option>100</option><option>300</option><option>500</option>
        <option>1000</option><option>2000</option><option value="custom">自訂…</option>
      </select></div>
    <div class="row" id="customRow" hidden><label>自訂人數</label><input id="totalNum" type="number" min="1" max="5000"></div>
    <div class="row"><label>進場時間 (秒)</label><input id="spawnSec" type="number" min="5" max="1800"></div>
    <div class="row"><label>隨機種子</label><input id="seed" type="number" min="0" max="999999"></div>

    <h2 class="gap">地面標線</h2>
    <div class="row"><label for="markings">啟用標線</label><input id="markings" type="checkbox"></div>
    <div class="row"><label>遵守率 <b id="compVal"></b>%</label><input id="compliance" type="range" min="0" max="100" step="5"></div>

    <h2 class="gap">模擬</h2>
    <button id="play" class="btn full">開始</button>
    <button id="reset" class="btn full">重置</button>
    <div class="row"><label>速度</label>
      <select id="speed"><option value="1">1×</option><option value="2">2×</option>
        <option value="5" selected>5×</option><option value="10">10×</option><option value="20">20×</option></select></div>
    <div class="row"><label>密度圖</label>
      <select id="heat"><option value="off">關</option><option value="now">即時</option><option value="acc">累積平均</option></select></div>
    <button id="compare" class="btn full">標線 有／無 批次比較</button>

    <h2 class="gap">場景</h2>
    <button id="demo" class="btn full">載入範例：台南火車站大廳</button>
    <button id="save" class="btn full">存成 JSON 檔</button>
    <button id="load" class="btn full">載入 JSON 檔</button>
    <button id="wipe" class="btn full">清空場地</button>
    <div id="serverBox" hidden>
      <button id="srvSave" class="btn full">存到伺服器 scenes/</button>
      <select id="srvList" class="full"></select>
    </div>
    <input id="file" type="file" accept="application/json,.json" hidden>
  </div>

  <div class="stage">
    <canvas id="board"></canvas>
    <div id="hint" class="hint"></div>
  </div>

  <div class="side">
    <div class="panel" id="inspector"></div>
    <div class="panel" id="metrics">
      <h2>即時指標</h2>
      <div id="metricList"></div>
      <canvas id="chart" width="196" height="70"></canvas>
      <p class="empty small">曲線：擁擠指數（走路中、速度低於 0.5 m/s 的比例）</p>
    </div>
    <div class="panel" id="result" hidden></div>
  </div>
</main>

<footer id="note"></footer>

<script src="sim.js"></script>
<script src="main.js"></script>
</body>
</html>
